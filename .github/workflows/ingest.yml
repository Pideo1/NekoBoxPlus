name: Ingest patches

on:
  push:
    branches: [main]
    paths:
      - "patches.tar.gz"
      - "patches.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      new_sha: ${{ steps.commit.outputs.sha }}
      prepared: ${{ steps.commit.outputs.prepared }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract patches archive into ./patches
        id: extract
        run: |
          # The push trigger fires on removal too (this job's own cleanup
          # commit deletes the archive) -- no archive here just means
          # "nothing to ingest", not a failure.
          found=()
          for f in patches.tar.gz patches.zip; do
            [ -f "$f" ] && found+=("$f")
          done

          if [ ${#found[@]} -eq 0 ]; then
            echo "no patches archive in repo root -- nothing to do"
            echo "extracted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ${#found[@]} -gt 1 ]; then
            echo "::error::several patch archives present (${found[*]}) -- keep exactly one"
            exit 1
          fi

          archive="${found[0]}"
          rm -rf patches
          mkdir patches
          case "$archive" in
            *.tar.gz) tar -xzf "$archive" -C patches ;;
            *.zip)    unzip -q "$archive" -d patches ;;
          esac

          echo "extracted=true" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Build workspace/, then discard patches/ and the archive
        id: commit
        if: steps.extract.outputs.extracted == 'true'
        run: |
          bash scripts/prepare-workspace.sh
          # Neither is committed: workspace/ is the only thing that
          # persists -- patches/ was never added to git, and this removes
          # the archive too, so nothing but the prepared sources is
          # left in the repo once this run is done.
          rm -rf patches patches.tar.gz patches.zip

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # If a previous run ever committed workspace/* as gitlinks (nested
          # .git not stripped in time), a plain `add -A` won't fix that on
          # its own -- git leaves an existing 160000 index entry alone
          # unless it's explicitly uncached first.
          git rm -r --cached workspace >/dev/null 2>&1 || true
          git add -A .
          if git diff --cached --quiet; then
            echo "nothing to commit"
            echo "prepared=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Apply patches archive -> workspace/ [skip ci]"
            git push
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: ingest
    if: needs.ingest.outputs.prepared == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.ingest.outputs.new_sha }}
    secrets: inherit
    permissions:
      contents: write
